[project]
name = "epot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "numba>=0.58.1",
    "numpy>=2.4,<2.5",
    "pgw-metric-vendored",
    "pot>=0.9.7",
    "pybind11>=3.0.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.10.1",
    "torch>=2.0.1",
]

[tool.uv.sources]
pgw-metric-vendored = { path = "vendor" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epot"]

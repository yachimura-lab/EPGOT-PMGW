[build]
publish = "docs/_site"
command = """
  # 1. Install uv
  chmod +x ./setup-uv.sh && ./setup-uv.sh

  # 2. Install Quarto
  curl -Lo quarto.tar.gz https://quarto.org/download/latest/quarto-linux-amd64.tar.gz
  mkdir quarto  # create the extraction directory
  tar -xzf quarto.tar.gz --strip-components=1 -C quarto
  export PATH=$PATH:$PWD/quarto/bin  # add the downloaded binary to PATH

  # 3. Install the required Python modules
  uv sync

  # 4. Build the documentation
  export QUARTO_PYTHON=$(pwd)/.venv/bin/python
  quarto render docs
"""

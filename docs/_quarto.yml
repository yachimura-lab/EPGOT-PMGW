project:
  title: "Entropic Partial OT"
  type: website
  render:
    - "*.qmd"
    - "*.ipynb"
  resources:
    - /asset/

website:
  title: "Entropic Partial OT"
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
    tools:
    - icon: github
      menu:
        - text: GitHub
          href: https://github.com/deltaex-corp/EPOT-pMGW/
  sidebar:
    - id: get-started
      title: Get Started
      style: floating
      align: left
      contents:
        - href: index.qmd
          text: Home
        - section: "notebooks"
          style: docked
          contents:
            - auto: "notebook/*.ipynb"

format:
  html:
    theme: yeti
    css: styles.css
    toc: true
[project]
name = "pgw-metric-vendored"
version = "0.0.0+git.8a9002e"
description = "uv packaging wrapper for the vendored PGW_Metric research code"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.0",
    "numba>=0.58.1",
    "numpy>=2.4,<2.5",
    "pot>=0.9.7",
    "scikit-learn>=1.9.0",
    "scipy>=1.10.1",
    "torch>=2.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"PGW_Metric/lib" = "lib"
